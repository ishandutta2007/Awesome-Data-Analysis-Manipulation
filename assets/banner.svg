<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="flow-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".1"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".7"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".1"/></linearGradient><linearGradient id="pill-grad-1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-10px) translateX(8px);opacity:.8}}.badge-label,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:44px;letter-spacing:-.5px;fill:url(#primary-grad)}.subtitle-text{font-weight:400;font-size:18px;fill:#94a3b8}.badge-label{font-size:13px;font-weight:600;fill:#cbd5e1}.tech-pill-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;font-weight:600;fill:#38bdf8}.ambient-glow-1{animation:pulseGlow 8s ease-in-out infinite;transform-origin:300px 100px}.ambient-glow-2{animation:pulseGlow 10s ease-in-out infinite reverse;transform-origin:900px 250px}.data-flow-line{stroke-dasharray:8 8;animation:dataDash 3s linear infinite}.data-flow-line-reverse{stroke-dasharray:6 6;animation:dataDash 4s linear infinite reverse}.particle{animation:floatParticle 5s ease-in-out infinite}.p2{animation-delay:1.5s}.p3{animation-delay:3s}</style><rect width="1200" height="360" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" rx="16"/><g class="ambient-glow-1"><circle cx="280" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" opacity=".12"/></g><g class="ambient-glow-2"><circle cx="920" cy="240" r="160" fill="#818cf8" filter="url(#glow)" opacity=".15"/></g><circle cx="600" cy="320" r="110" fill="#c084fc" filter="url(#glow)" opacity=".1"/><g stroke="#334155" stroke-width="1" opacity=".25"><line x1="80" x2="80" y1="0" y2="360"/><line x1="280" x2="280" y1="0" y2="360"/><line x1="480" x2="480" y1="0" y2="360"/><line x1="680" x2="680" y1="0" y2="360"/><line x1="880" x2="880" y1="0" y2="360"/><line x1="1080" x2="1080" y1="0" y2="360"/><line x1="0" x2="1200" y1="90" y2="90"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="270" y2="270"/></g><g fill="none"><path stroke="url(#flow-grad)" stroke-width="2" d="M 50 70 Q 250 20, 450 70 T 850 70 T 1150 70" class="data-flow-line"/><path stroke="url(#flow-grad)" stroke-width="2" d="M 50 290 Q 300 340, 600 290 T 1150 290" class="data-flow-line-reverse"/><path stroke="#38bdf8" stroke-opacity=".3" stroke-width="1.5" d="M 120 330 C 350 220, 850 350, 1080 230" class="data-flow-line"/></g><g fill="#38bdf8"><circle cx="200" cy="55" r="4" class="particle"/><circle cx="450" cy="70" r="5" class="particle p2" filter="url(#soft-glow)"/><circle cx="750" cy="70" r="3.5" class="particle p3"/><circle cx="1020" cy="65" r="5" class="particle p2" filter="url(#soft-glow)"/><circle cx="150" cy="295" r="4" class="particle p3"/><circle cx="600" cy="290" r="5.5" class="particle p2" filter="url(#soft-glow)"/><circle cx="950" cy="305" r="4" class="particle"/></g><g transform="translate(600, 52)"><rect width="370" height="32" x="-185" y="-16" fill="url(#pill-grad-1)" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" rx="16"/><circle cx="-160" cy="0" r="4.5" fill="#38bdf8"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;1;0.4"/></circle><path fill="#38bdf8" d="M -145 -7 L -151 1 L -146 1 L -148 7 L -140 -1 L -145 -1 Z"/><text x="5" y="5" class="badge-label" text-anchor="middle">CURATED ECOSYSTEM &amp; BENCHMARKS</text></g><text x="600" y="128" class="title-text" filter="url(#soft-glow)" text-anchor="middle">Awesome Data Analysis &amp; Manipulation</text><text x="600" y="168" class="subtitle-text" text-anchor="middle">High-Performance DataFrame Engines • Visual ETL Tools • Analytical In-Memory Databases • Modern Lakehouses</text><g><g transform="translate(130, 205) translate(0, 0)"><rect width="210" height="42" fill="#1e293b" fill-opacity=".75" stroke="#334155" stroke-width="1" rx="10"/><path fill="#38bdf8" d="M 22 14 L 16 22 L 21 22 L 19 28 L 27 20 L 22 20 Z"/><text x="115" y="26" class="badge-label" text-anchor="middle">Polars &amp; DuckDB</text></g><g transform="translate(130, 205) translate(240, 0)"><rect width="210" height="42" fill="#1e293b" fill-opacity=".75" stroke="#334155" stroke-width="1" rx="10"/><path fill="#818cf8" d="M 24 14 C 21 16 19 20 18 24 L 21 27 C 25 26 29 24 31 21 C 31 17 28 14 24 14 Z M 18 25 L 14 27 L 17 23 Z"/><text x="115" y="26" class="badge-label" text-anchor="middle">Spark, Ray &amp; Dask</text></g><g transform="translate(130, 205) translate(480, 0)"><rect width="220" height="42" fill="#1e293b" fill-opacity=".75" stroke="#334155" stroke-width="1" rx="10"/><path fill="#c084fc" d="M 16 27 L 16 23 L 19 23 L 19 27 Z M 21 27 L 21 18 L 24 18 L 24 27 Z M 26 27 L