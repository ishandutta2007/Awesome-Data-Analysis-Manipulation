<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pill-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: url(#primary-grad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #cbd5e1;
    }
    .tech-pill-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
    }
    
    /* Dynamic pulsing & flowing animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.05); }
    }
    @keyframes dataDash {
      to { stroke-dashoffset: -120; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-10px) translateX(8px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }

    .ambient-glow-1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 300px 100px;
    }
    .ambient-glow-2 {
      animation: pulseGlow 10s ease-in-out infinite reverse;
      transform-origin: 900px 250px;
    }
    .data-flow-line {
      stroke-dasharray: 8 8;
      animation: dataDash 3s linear infinite;
    }
    .data-flow-line-reverse {
      stroke-dasharray: 6 6;
      animation: dataDash 4s linear infinite reverse;
    }
    .particle {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .p2 { animation-delay: 1.5s; }
    .p3 { animation-delay: 3s; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Dynamic Ambient Glow Blobs in Background -->
  <g class="ambient-glow-1">
    <circle cx="280" cy="90" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  </g>
  <g class="ambient-glow-2">
    <circle cx="920" cy="240" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  </g>
  <circle cx="600" cy="320" r="110" fill="#c084fc" opacity="0.10" filter="url(#glow)" />

  <!-- Subtle Analytical Grid & Geometric Node Network -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="280" y1="0" x2="280" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="880" y1="0" x2="880" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Animated Data Pipeline Pathways in Background -->
  <g fill="none">
    <path d="M 50 70 Q 250 20, 450 70 T 850 70 T 1150 70" stroke="url(#flow-grad)" stroke-width="2" class="data-flow-line" />
    <path d="M 50 290 Q 300 340, 600 290 T 1150 290" stroke="url(#flow-grad)" stroke-width="2" class="data-flow-line-reverse" />
    <path d="M 120 330 C 350 220, 850 350, 1080 230" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="data-flow-line" />
  </g>

  <!-- Dynamic Floating Pulse Nodes (Data Nodes) -->
  <g fill="#38bdf8">
    <circle cx="200" cy="55" r="4" class="particle" />
    <circle cx="450" cy="70" r="5" class="particle p2" filter="url(#soft-glow)" />
    <circle cx="750" cy="70" r="3.5" class="particle p3" />
    <circle cx="1020" cy="65" r="5" class="particle p2" filter="url(#soft-glow)" />
    <circle cx="150" cy="295" r="4" class="particle p3" />
    <circle cx="600" cy="290" r="5.5" class="particle p2" filter="url(#soft-glow)" />
    <circle cx="950" cy="305" r="4" class="particle" />
  </g>

  <!-- FOREGROUND CONTENT: Header Pill, Title, Subtitle, Key Features Pill Bar -->
  <!-- Top Category Tag Pill -->
  <g transform="translate(600, 52)">
    <rect x="-185" y="-16" width="370" height="32" rx="16" fill="url(#pill-grad-1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="-160" cy="0" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="5" text-anchor="middle" class="badge-label">⚡ CURATED ECOSYSTEM &amp; BENCHMARKS</text>
  </g>

  <!-- Main Showcase Title -->
  <text x="600" y="128" text-anchor="middle" class="title-text" filter="url(#soft-glow)">Awesome Data Analysis &amp; Manipulation</text>

  <!-- Subtitle Line -->
  <text x="600" y="168" text-anchor="middle" class="subtitle-text">
    High-Performance DataFrame Engines • Visual ETL Tools • Analytical In-Memory Databases • Modern Lakehouses
  </text>

  <!-- Architectural Feature Badges / Highlights Grid -->
  <g transform="translate(130, 205)">
    <!-- Pill 1: In-Memory Analytics -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
      <text x="105" y="26" text-anchor="middle" class="badge-label">⚡ Polars &amp; DuckDB</text>
    </g>

    <!-- Pill 2: Distributed Processing -->
    <g transform="translate(240, 0)">
      <rect width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
      <text x="105" y="26" text-anchor="middle" class="badge-label">🚀 Spark, Ray &amp; Dask</text>
    </g>

    <!-- Pill 3: Visual ETL & Low-Code -->
    <g transform="translate(480, 0)">
      <rect width="220" height="42" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
      <text x="110" y="26" text-anchor="middle" class="badge-label">📊 Visual ETL &amp; Alteryx Alts</text>
    </g>

    <!-- Pill 4: Modern Lakehouse / SaaS -->
    <g transform="translate(730, 0)">
      <rect width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
      <text x="105" y="26" text-anchor="middle" class="badge-label">🏢 Enterprise SaaS &amp; Cloud</text>
    </g>
  </g>

  <!-- Bottom Interactive Tech Flow Summary Bar -->
  <g transform="translate(600, 300)">
    <text x="0" y="0" text-anchor="middle" class="tech-pill-text" opacity="0.85">
      Python • Rust • Arrow Columnar Format • SQL • Vectorized Execution • Data Wrangling
    </text>
  </g>
</svg>
